<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your DREAMSheet AI account</title>
  </head>
  <body style="margin:0;background:#f5f5f4;color:#292524;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f5f4">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;overflow:hidden;background:#ffffff;border-top:4px solid #059669;border-radius:10px">
            <tr>
              <td style="background:#1c1917;padding:22px 28px">
                <!-- TODO: Add the corrected production mark-only asset supplied by the brand owner. -->
                <p style="margin:0;color:#ffffff;font-size:24px;font-weight:400;letter-spacing:-.04em"><strong style="font-weight:700">DREAM</strong>Sheet <span style="color:#34d399;font-weight:400">AI</span></p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px">
                <p style="margin:0 0 12px;color:#047857;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase">Confirm your account</p>
                <h1 style="margin:0 0 16px;color:#1c1917;font-size:26px;line-height:1.2">Your planning space is ready.</h1>
                <p style="margin:0 0 24px;color:#57534e;font-size:15px;line-height:1.65">Confirm your email address to finish creating your DREAMSheet AI account. Your account is not active until you complete this step.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#059669;color:#ffffff;padding:13px 20px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none">Confirm Email Address</a>
                <p style="margin:26px 0 0;color:#78716c;font-size:12px;line-height:1.6">If you did not request this account, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
